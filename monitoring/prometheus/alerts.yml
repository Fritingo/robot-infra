groups:
  - name: robot-infra-streaming-and-runtime
    interval: 15s
    rules:
      - alert: RobotSelkiesExporterDown
        expr: robot_selkies_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Selkies desktop exporter unreachable ({{ $labels.user }})"
          description: "User {{ $labels.user }} Selkies /api/metrics loopback scrape has failed for 1m."

      - alert: RobotCoreServicePortDown
        expr: robot_service_port_listening{service=~"selkies|sshd|ssh_ws|zenoh_ws"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Core service {{ $labels.service }} port {{ $labels.port }} down ({{ $labels.user }})"
          description: "Service {{ $labels.service }} inside user {{ $labels.user }} Pod is not listening on port {{ $labels.port }}."

      - alert: RobotStreamingLowFPS
        expr: fps > 0 and fps < 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Low Selkies streaming FPS ({{ $labels.user }})"
          description: "Observed FPS for user {{ $labels.user }} dropped to {{ printf \"%.1f\" $value }} FPS (< 20 FPS)."

      - alert: RobotStreamingHighLatency
        expr: latency > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Selkies streaming latency ({{ $labels.user }})"
          description: "Client-observed latency for user {{ $labels.user }} is {{ printf \"%.1f\" $value }} ms (> 100 ms)."

      - alert: RobotWebRTCDroppedFrames
        expr: rate(webrtc_bridge_dropped_frames[2m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WebRTC encoder/bridge dropping frames ({{ $labels.user }})"
          description: "User {{ $labels.user }} is dropping {{ printf \"%.2f\" $value }} frames/sec before packetization."

      - alert: RobotShmUsageHigh
        expr: robot_shm_usage_ratio > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "/dev/shm usage above 85% ({{ $labels.user }})"
          description: "User {{ $labels.user }} /dev/shm usage is {{ $value | humanizePercentage }} (risk for Isaac Sim / ROS 2 SHM)."

      - alert: RobotContainerMemoryHigh
        expr: |
          (
            container_memory_working_set_bytes{namespace="robotics",container="selkies-desktop"}
            / on(namespace,pod,container) group_left
            kube_pod_container_resource_limits{namespace="robotics",container="selkies-desktop",resource="memory"}
          ) > 0.85
          or
          (robot_local_memory_used_bytes / robot_local_memory_limit_bytes) > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Container memory usage above 85% ({{ $labels.pod }} {{ $labels.user }})"
          description: "Memory usage reached {{ $value | humanizePercentage }} of limit — risk of OOMKill."

      - alert: RobotCpuThrottlingHigh
        expr: |
          (
            rate(container_cpu_cfs_throttled_periods_total{namespace="robotics",container="selkies-desktop"}[2m])
            /
            clamp_min(rate(container_cpu_cfs_periods_total{namespace="robotics",container="selkies-desktop"}[2m]), 1)
          ) > 0.25
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High CPU CFS throttling may cause Selkies frame drops ({{ $labels.pod }})"
          description: "Container CPU throttling ratio is {{ $value | humanizePercentage }} (check parallel colcon builds)."

      - alert: RobotPvcSpaceLow
        expr: |
          (
            kubelet_volume_stats_used_bytes{namespace="robotics"}
            /
            kubelet_volume_stats_capacity_bytes{namespace="robotics"}
          ) > 0.85
          or
          (robot_podman_storage_used_bytes / clamp_min(robot_podman_storage_total_bytes, 1)) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PVC / Podman storage usage above 85%"
          description: "Storage utilization is {{ $value | humanizePercentage }} — clean unused Podman images or expand PVC."

      - alert: RobotPro6000GpuVramHigh
        expr: |
          (
            DCGM_FI_DEV_FB_USED{exported_namespace="robotics"}
            /
            clamp_min(DCGM_FI_DEV_FB_USED{exported_namespace="robotics"} + DCGM_FI_DEV_FB_FREE{exported_namespace="robotics"}, 1)
          ) > 0.90
          or
          (robot_local_gpu_memory_used_bytes / clamp_min(robot_local_gpu_memory_total_bytes, 1)) > 0.90
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "RTX PRO 6000 MIG VRAM usage above 90%"
          description: "GPU VRAM utilization is {{ $value | humanizePercentage }}."

      - alert: RobotPro6000NvencOverloaded
        expr: |
          (
            DCGM_FI_DEV_ENC_UTIL{exported_namespace="robotics"} > 80
            or
            robot_local_gpu_encoder_utilization_percent > 80
          )
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "RTX PRO 6000 NVENC encoder utilization above 80%"
          description: "NVENC hardware encoder load is {{ printf \"%.1f\" $value }}%; consider lowering SELKIES_VIDEO_BITRATE or FPS."

      - alert: RobotPro6000GpuXidError
        expr: increase(DCGM_FI_DEV_XID_ERRORS{exported_namespace="robotics"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "NVIDIA GPU XID hardware/driver error detected on robotics workload"
          description: "DCGM reported XID error on {{ $labels.Hostname }} ({{ $labels.exported_pod }})."
