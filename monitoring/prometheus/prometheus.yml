global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: robot-infra-selkies
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["selkies:9108"]
        labels:
          namespace: robotics
          user: dio
          pod: local-selkies-v3
          app_kubernetes_io_component: selkies
    metric_relabel_configs:
      # Safety guard: always drop high-cardinality raw WebRTC Info label dump
      - source_labels: [__name__]
        regex: "webrtc_statistics_info"
        action: drop
