apiVersion: apps/v1
kind: Deployment
metadata:
  name: selkies
spec:
  template:
    spec:
      containers:
        - name: selkies-desktop
          # v4 生產零中斷策略：每位使用者獨立釘選映像標籤，未來基底升級時不會強制重啟線上開發者
          image: registry.local/robotics/robot-infra:v4
          env:
            - name: SELKIES_BASIC_AUTH_USER
              value: "dio"
            - name: SELKIES_WEBRTC_UDP_MUX_PORT
              value: "50001"
            - name: ROS_DOMAIN_ID
              value: "11"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/mig-1g.24gb.gfx: null
              nvidia.com/mig-2g.48gb.gfx: 1
            limits:
              cpu: "12"
              memory: "48Gi"
              nvidia.com/mig-1g.24gb.gfx: null
              nvidia.com/mig-2g.48gb.gfx: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: selkies-pvc
spec:
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: selkies-podman-pvc
spec:
  resources:
    requests:
      storage: 150Gi
