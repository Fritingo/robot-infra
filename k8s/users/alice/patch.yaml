apiVersion: apps/v1
kind: Deployment
metadata:
  name: selkies
spec:
  template:
    spec:
      containers:
        - name: selkies-desktop
          # v4 生產零中斷策略：每位使用者獨立釘選映像標籤，未來基底升級時不會強制重啟線上開發者
          image: registry.local/robotics/robot-infra:v4
          env:
            - name: SELKIES_BASIC_AUTH_USER
              value: "alice"
            - name: SELKIES_WEBRTC_UDP_MUX_PORT
              value: "50002"
            - name: ROS_DOMAIN_ID
              value: "12"
