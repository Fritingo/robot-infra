{{- if .Values.user.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "selkies-user.name" . }}-svc
  labels:
    {{- include "selkies-user.labels" . | nindent 4 }}
spec:
  # 全數採 ClusterIP，徹底免 NodePort / LoadBalancer IP，統一經由單一 Ingress 進入
  type: ClusterIP
  selector:
    {{- include "selkies-user.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-web
      port: 80
      targetPort: http-web
      protocol: TCP
    {{- if .Values.ssh.enabled }}
    - name: ssh-ws
      port: {{ .Values.ssh.wsBridgePort | default 2223 }}
      targetPort: ssh-ws
      protocol: TCP
    - name: ssh-tcp
      port: {{ .Values.ssh.sshdPort | default 2222 }}
      targetPort: ssh-tcp
      protocol: TCP
    {{- end }}
    {{- if and .Values.rosBridge .Values.rosBridge.enabled }}
    - name: zenoh-ws
      port: {{ .Values.rosBridge.wsBridgePort | default 7448 }}
      targetPort: zenoh-ws
      protocol: TCP
    {{- end }}
{{- end }}
