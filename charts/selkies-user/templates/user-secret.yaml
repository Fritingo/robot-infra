{{- if and .Values.user.enabled (not .Values.user.auth.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selkies-user.name" . }}-auth
  labels:
    {{- include "selkies-user.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEB_PASSWORD: {{ .Values.user.auth.webPassword | required "user.auth.webPassword (or user.auth.existingSecretName) is required" | quote }}
  LINUX_PASSWORD: {{ .Values.user.auth.linuxPassword | default .Values.user.auth.webPassword | quote }}
{{- end }}
