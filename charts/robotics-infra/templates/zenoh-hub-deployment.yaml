{{- if and .Values.rosZenohHub .Values.rosZenohHub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "robotics-infra.fullname" . }}-zenoh-hub
  labels:
    {{- include "robotics-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: zenoh-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: zenoh-hub
  template:
    metadata:
      labels:
        {{- include "robotics-infra.labels" . | nindent 8 }}
        app.kubernetes.io/component: zenoh-hub
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      {{- with .Values.rosZenohHub.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $placement := .Values.rosZenohHub.placement | default "pro6000" -}}
      {{- if eq $placement "pro6000" }}
      nodeSelector:
        robot-infra/gpu-pool: "rtx-pro-6000"
        {{- with .Values.rosZenohHub.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.rosZenohHub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.rosZenohHub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $placement "cpu-only" }}
      # 強制排除所有 GPU 節點（僅於具備純 CPU 節點之叢集使用）
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      {{- else }}
      # 無純 CPU 節點模式：集中排程至 RTX PRO 6000 節點（佔用 0 GPU），嚴格排除 H200 / H100 / A100 / B300
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: robot-infra/gpu-pool
                    operator: In
                    values:
                      - rtx-pro-6000
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-A100-SXM4-40GB
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-H100-80GB-HBM3
                      - NVIDIA-H100-PCIe
                      - NVIDIA-H100-NVL
                      - NVIDIA-H200
                      - NVIDIA-H200-SXM5-141GB
                      - NVIDIA-H200-NVL
                      - NVIDIA-B200
                      - NVIDIA-B300
                      - NVIDIA-GB200
                      - NVIDIA-GB300
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zenoh-router
          image: "{{ .Values.rosZenohHub.image.repository }}:{{ .Values.rosZenohHub.image.tag }}"
          imagePullPolicy: {{ .Values.rosZenohHub.image.pullPolicy }}
          env:
            # 確保在 GPU 節點上絕不暴露或佔用任何 GPU / MIG 裝置
            - name: NVIDIA_VISIBLE_DEVICES
              value: "void"
          command:
            - /usr/local/bin/zenoh-bridge-ros2dds
            - --no-multicast-scouting
            - -l
            - "tcp/0.0.0.0:{{ .Values.rosZenohHub.tcpPort | default 7447 }}"
            - router
          ports:
            - name: zenoh-tcp
              containerPort: {{ .Values.rosZenohHub.tcpPort | default 7447 }}
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.rosZenohHub.resources | nindent 12 }}
        - name: zenoh-ws
          image: "{{ .Values.rosZenohHub.image.repository }}:{{ .Values.rosZenohHub.image.tag }}"
          imagePullPolicy: {{ .Values.rosZenohHub.image.pullPolicy }}
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "void"
          command:
            - /usr/local/bin/websocat
            - --binary
            - --exit-on-eof
            - "ws-l:0.0.0.0:{{ .Values.rosZenohHub.wsPort | default 7448 }}"
            - "tcp:127.0.0.1:{{ .Values.rosZenohHub.tcpPort | default 7447 }}"
          ports:
            - name: zenoh-ws
              containerPort: {{ .Values.rosZenohHub.wsPort | default 7448 }}
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
        {{- if and .Values.monitoring .Values.monitoring.exporterConfigMap .Values.monitoring.exporterConfigMap.enabled }}
        - name: metrics-exporter
          image: "{{ .Values.rosZenohHub.image.repository }}:{{ .Values.rosZenohHub.image.tag }}"
          imagePullPolicy: {{ .Values.rosZenohHub.image.pullPolicy }}
          command:
            - python3
            - /opt/monitoring/robot_metrics_exporter.py
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "void"
            - name: EXPORTER_MODE
              value: "zenoh-hub"
            - name: EXPORTER_PORT
              value: "9108"
            - name: ZENOH_TCP_PORT
              value: {{ .Values.rosZenohHub.tcpPort | default 7447 | quote }}
            - name: ZENOH_WS_PORT
              value: {{ .Values.rosZenohHub.wsPort | default 7448 | quote }}
          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: metrics-exporter-script
              mountPath: /opt/monitoring
              readOnly: true
      volumes:
        - name: metrics-exporter-script
          configMap:
            name: {{ .Values.monitoring.exporterConfigMap.name | default "selkies-metrics-exporter" }}
            defaultMode: 0444
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "robotics-infra.fullname" . }}-zenoh-hub
  labels:
    {{- include "robotics-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: zenoh-hub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zenoh-hub
  ports:
    - name: zenoh-tcp
      port: {{ .Values.rosZenohHub.tcpPort | default 7447 }}
      targetPort: zenoh-tcp
      protocol: TCP
    - name: zenoh-ws
      port: {{ .Values.rosZenohHub.wsPort | default 7448 }}
      targetPort: zenoh-ws
      protocol: TCP
    {{- if and .Values.monitoring .Values.monitoring.exporterConfigMap .Values.monitoring.exporterConfigMap.enabled }}
    - name: metrics
      port: 9108
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- if .Values.rosZenohHub.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "robotics-infra.fullname" . }}-zenoh-hub-ingress
  labels:
    {{- include "robotics-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: zenoh-hub
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    {{- if .Values.rosZenohHub.ingress.authSecretName }}
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.rosZenohHub.ingress.authSecretName | quote }}
    nginx.ingress.kubernetes.io/auth-realm: "Zenoh ROS2 Bridge Authentication Required"
    {{- end }}
    {{- if .Values.rosZenohHub.ingress.whitelistSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.rosZenohHub.ingress.whitelistSourceRange | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.rosZenohHub.ingress.className | quote }}
  {{- if .Values.rosZenohHub.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.rosZenohHub.ingress.tls.secretName | quote }}
      hosts:
        - {{ .Values.rosZenohHub.ingress.host | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.rosZenohHub.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.rosZenohHub.ingress.path | default "/zenoh" | quote }}
            pathType: Exact
            backend:
              service:
                name: {{ include "robotics-infra.fullname" . }}-zenoh-hub
                port:
                  number: {{ .Values.rosZenohHub.wsPort | default 7448 }}
{{- end }}
{{- end }}
