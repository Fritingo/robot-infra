{{- if and .Values.coturn.enabled (not .Values.coturn.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: coturn-infra-turn-secret
  labels:
    {{- include "robotics-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
type: Opaque
stringData:
  TURN_SHARED_SECRET: {{ .Values.coturn.sharedSecret | required "coturn.sharedSecret (or coturn.existingSecretName) is required" | quote }}
{{- end }}
