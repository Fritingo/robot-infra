{{- if .Values.coturn.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "robotics-infra.fullname" . }}-coturn-config
  labels:
    {{- include "robotics-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
data:
  turnserver.conf: |
    listening-port={{ .Values.coturn.listeningPort }}
    min-port={{ .Values.coturn.minPort }}
    max-port={{ .Values.coturn.maxPort }}
    realm={{ .Values.coturn.realm }}
    external-ip={{ .Values.coturn.externalIp }}

    use-auth-secret
    fingerprint
    no-cli
    no-multicast-peers
    no-tlsv1
    no-tlsv1_1

    {{- if .Values.coturn.noTcpRelay }}
    no-tcp-relay
    {{- end }}

    allowed-peer-ip={{ .Values.coturn.podCidr }}
    denied-peer-ip=169.254.169.254
    no-loopback-peers

    log-file=stdout
{{- end }}
