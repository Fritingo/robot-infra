{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coturn-infra.fullname" . }}-turn-secret
  labels:
    {{- include "coturn-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  TURN_SHARED_SECRET: {{ .Values.sharedSecret | required "sharedSecret (or existingSecretName) is required" | quote }}
{{- end }}
