apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coturn-infra.fullname" . }}-config
  labels:
    {{- include "coturn-infra.labels" . | nindent 4 }}
data:
  turnserver.conf: |
    listening-port={{ .Values.listeningPort }}
    min-port={{ .Values.minPort }}
    max-port={{ .Values.maxPort }}
    realm={{ .Values.realm }}
    external-ip={{ .Values.externalIp }}

    use-auth-secret
    fingerprint
    no-cli
    no-multicast-peers
    no-tlsv1
    no-tlsv1_1

    {{- if .Values.noTcpRelay }}
    no-tcp-relay
    {{- end }}

    # 放行 K8s Pod CIDR，禁止接觸 Metadata IP 與 Loopback
    allowed-peer-ip={{ .Values.podCidr }}
    denied-peer-ip=169.254.169.254
    no-loopback-peers

    log-file=stdout
