[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 8192x4096x24 -s 0 -dpms +extension COMPOSITE +extension DAMAGE +extension GLX +extension RANDR +extension RENDER +extension MIT-SHM +extension XFIXES +extension XTEST +iglx +render -nolisten tcp -ac -noreset -shmem
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",DISPLAY=":0"
priority=10
autostart=true
autorestart=true
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err.log

[program:pulseaudio]
command=/usr/bin/pulseaudio --disallow-exit --exit-idle-time=-1 --log-target=stderr
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",PULSE_RUNTIME_PATH="/tmp/runtime-ubuntu/pulse"
priority=20
autostart=true
autorestart=true
stdout_logfile=/tmp/pulseaudio.log
stderr_logfile=/tmp/pulseaudio.err.log

[program:xfce4]
command=/bin/bash -c "until [ -S /tmp/.X11-unix/X0 ]; do sleep 0.5; done; exec dbus-launch --exit-with-session startxfce4"
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",DISPLAY=":0",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",PULSE_RUNTIME_PATH="/tmp/runtime-ubuntu/pulse",PULSE_SERVER="unix:/tmp/runtime-ubuntu/pulse/native",MESA_LOADER_DRIVER_OVERRIDE="zink",GALLIUM_DRIVER="zink",LIBGL_KOPPER_DRI2="1"
priority=30
autostart=true
autorestart=true
stdout_logfile=/tmp/xfce4.log
stderr_logfile=/tmp/xfce4.err.log

[program:selkies]
command=/usr/local/bin/start-selkies.sh
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",DISPLAY=":0",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",PULSE_RUNTIME_PATH="/tmp/runtime-ubuntu/pulse",PULSE_SERVER="unix:/tmp/runtime-ubuntu/pulse/native"
priority=40
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0