[program:zenohd]
command=/bin/bash -c "source /opt/ros/jazzy/setup.bash && unset ZENOH_CONFIG_OVERRIDE && export ZENOH_CONFIG_OVERRIDE='listen/endpoints=[\"tcp/127.0.0.1:7447\"]' && exec ros2 run rmw_zenoh_cpp rmw_zenohd"
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
priority=60
# v3 預設改為 CycloneDDS + 按需 ros-bridge (127.0.0.1:7447)；若需切換回純 rmw_zenoh_cpp 可執行 supervisorctl start zenohd
autostart=false
autorestart=true
startsecs=2
stdout_logfile=/tmp/zenohd.log
stderr_logfile=/tmp/zenohd.err.log
