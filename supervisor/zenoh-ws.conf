[program:zenoh-ws]
command=/usr/bin/python3 /usr/local/bin/zenoh-ws-auth-proxy.py
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
priority=56
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/zenoh-ws.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/tmp/zenoh-ws.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
