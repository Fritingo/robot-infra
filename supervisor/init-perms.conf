[program:init-perms]
command=/usr/local/bin/init-perms.sh
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
priority=1
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/tmp/init-perms.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/tmp/init-perms.err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1
