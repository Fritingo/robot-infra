[program:ssh-ws]
command=/usr/local/bin/websocat --binary --exit-on-eof ws-l:0.0.0.0:2223 tcp:127.0.0.1:2222
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
priority=55
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/ssh-ws.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/tmp/ssh-ws.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
