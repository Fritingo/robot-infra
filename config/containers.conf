[containers]
# 非特權容器內 /proc/sys 為唯讀，清空預設 ping_group_range 避免 --network=pasta/slirp4netns 報 Read-only file system
default_sysctls = []
cgroups = "disabled"
# 關閉內層容器建立 kernel session keyring，使生產環境 Seccomp 可持續封鎖 keyctl/add_key/request_key
keyring = false

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

[network]
default_rootless_network_cmd = "pasta"
